<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../images/favicon.ico" />
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css"
        rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Open Sans", Times, serif;
            font-weight: lighter;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header,
        footer {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 10;
        }

        header {
            top: 0;
            background-color: white;
            border-bottom: 1px solid #dee2e6;
        }

        footer {
            bottom: 0;
            background-color: white;
            border-top: 1px solid #dee2e6;
        }

        footer a {
            text-decoration: none;
            color: inherit;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 900px;
        }

        body.bg-dark header,
        body.bg-dark footer {
            background-color: #212529;
        }

        body.bg-dark header,
        body.bg-dark footer,
        body.bg-dark h1,
        body.bg-dark h2,
        body.bg-dark p,
        body.bg-dark a {
            color: white;
        }
    </style>
</head>

<body class="bg-dark text-dark">
    <header class="d-flex justify-content-end py-3 px-3">
        <div class="d-flex flex-column align-items-end gap-1">
            <!-- Date & Time -->
            <div id="dateTime" class="bg-transparent"></div>
        </div>
    </header>
    <div class="main-content">
        <div class="grid">
            <!-- Slate App -->
            <div class="mb-3 text-center" style="width: 100px;">
                <a href="/apps/slate/index.html" target="_blank" rel="noreferrer" class="text-decoration-none">
                    <img src="../apps/slate/icons/Icon-512.png" class="rounded-4" alt="Slate App"
                        style="width: 75px; height: 75px; object-fit: cover;" />
                </a>
                <p>
                    <b>
                        Slate
                    </b>
                </p>
            </div>
        </div>
    </div>

    <footer class="d-flex justify-content-between align-items-center p-3">
        <div class="text-center">
            <a href="../index.html" class="mx-2">
                <i class="bi bi-box-arrow-left" style="font-size: 2rem"></i>
            </a>
        </div>
        <div class="form-switch d-inline-block mx-2">
            <input class="form-check-input mt-3 mx-2" type="checkbox" role="switch" id="themeToggle" checked />
            <a class="form-check-label">
                <i class="bi bi-moon-stars-fill" style="font-size: 2rem"></i>
            </a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script>
        const toggleBtn = document.getElementById("themeToggle");
        toggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("bg-dark");
            document.body.classList.toggle("text-light");
        });

        $(function () {
            $('[data-toggle="tooltip"]').tooltip();
        });

        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: 'numeric', hour12: true };
            document.getElementById('dateTime').textContent = now.toLocaleString('en-US', options);
        }

        updateDateTime();
        setInterval(updateDateTime, 60000);
    </script>
</body>

</html>
